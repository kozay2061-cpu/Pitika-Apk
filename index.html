<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> ပါဠိတော်၊ အဋ္ဌကထာ၊  ဋီကာ နိဿယ </title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#8b0000">
</head>
<body>
  <header class="app-bar">
    <h1> ပါဠိတော်၊ အဋ္ဌကထာ၊  ဋီကာ နိဿယ </h1>
    <div class="controls">
      <button id="themeToggle">🌙</button>
      <button id="fontDec">A-</button>
      <button id="fontInc">A+</button>
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="တရားခေါင်းစဉ် ရှာရန်...">
  </div>

  <main id="appContainer">
    <section id="listView" class="view">
      <ul id="articleList"></ul>
    </section>

    <!-- Detail View တွင် class="view hidden" ဟု ရှိရပါမည် -->
<section id="detailView" class="view hidden">
  <button id="backBtn">⬅ နောက်သို့</button>
  <h2 id="articleTitle"></h2>
  <hr>
  <div id="articleContent"></div>
</section>

  </main>

  <script src="app.js"></script>
</body>
</html>
