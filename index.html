<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ပါဠိမြန်မာ ပိဋကတ်</title>
    <style>
        /* App ရဲ့ Design ကို ဒီမှာ ပြင်လို့ရပါတယ် */
        body { 
            font-family: 'Pyidaungsu', 'Padauk', sans-serif; 
            background-color: #f4ecdf; /* စာအုပ်ရောင် နောက်ခံ */
            padding: 15px; 
            margin: 0;
        }
        .container { 
            background-color: #ffffff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            line-height: 2; 
            font-size: 18px; 
            color: #333333;
        }
        #loading { text-align: center; color: #666; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">စာများကို ဆွဲယူနေပါသည်... ခဏစောင့်ပါ...</div>
        <!-- ယူလာတဲ့ စာတွေ ဒီနေရာမှာ ပေါ်လာပါမယ် -->
        <div id="content"></div> 
    </div>

    <script>
        // မူရင်းလင့်ခ်
        const targetUrl = 'https://palimyanmarpitaka.blogspot.com/2021/05/blog-post.html';
        
        // Proxy သုံးပြီး စာလှမ်းဆွဲယူခြင်း
        const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

        fetch(proxyUrl)
            .then(response => response.json())
            .then(data => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                
                // .post-body (စာပိုဒ်တွေရှိတဲ့ နေရာ) ကိုပဲ ရွေးယူမယ် 
                // (ဒီလိုယူလိုက်တဲ့အတွက် Title နဲ့ Comments တွေ အလိုလို ပျောက်သွားပါမယ်)
                let postBody = doc.querySelector('.post-body');
                
                if(postBody) {
                    // ပုံ (img) တွေကို ရှာပြီး အကုန်ဖယ်ထုတ်မယ်
                    postBody.querySelectorAll('img').forEach(img => img.remove());
                    
                    // Loading စာသားကို ဖျောက်ပြီး စာတွေ ထည့်ပြမယ်
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').innerHTML = postBody.innerHTML;
                } else {
                    document.getElementById('loading').innerText = "စာများ ရှာမတွေ့ပါ။";
                }
            })
            .catch(error => {
                document.getElementById('loading').innerText = "အင်တာနက် ချိတ်ဆက်မှု အဆင်မပြေပါ။";
            });
    </script>
</body>
</html>
